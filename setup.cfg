[metadata]
name = commitron-cli
version = attr: commitron.__version__
description = I create commit messages so you don't have to — an AI-assisted multi-commit Git CLI.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
author = Commitron contributors
keywords = git, commit, openai, openrouter, cli, commitron
project_urls =
    Homepage = https://github.com/fardeenes7/commitron
    Issues = https://github.com/fardeenes7/commitron/issues
classifiers =
    Development Status :: 4 - Beta
    Environment :: Console
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Topic :: Software Development :: Version Control :: Git

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    commitron = commitron.cli:main
